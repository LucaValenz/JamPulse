version: "3.9"

services:

  mongo:
    image: mongo:7
    restart: always
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    restart: always
    env_file: ./backend/.env
    # Mantiene gli upload precedenti disponibili per l'importazione in MongoDB.
    volumes:
      - post_uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    restart: always

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend

volumes:
  mongo_data:
  # Solo archivio precedente: i nuovi upload vengono salvati in MongoDB.
  post_uploads:
