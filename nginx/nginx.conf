server {
    listen 80;

    # Proxy del frontend (React) al container frontend
    location / {
        proxy_pass http://frontend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Necessario per React Router se il frontend usa History API
        # Ma se il container frontend ha già try_files, non serve qui
    }

    # Proxy delle API al backend
    location /api/ {
        # Il file è limitato a 5 MB dal backend; lasciamo spazio agli header
        # multipart e ai campi testuali per non bloccare upload validi nel proxy.
        client_max_body_size 6m;
        proxy_pass http://backend:4000;   # <- usa la porta che hai in .env
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Proxy di Socket.IO
    location /socket.io/ {
        proxy_pass http://backend:4000;   # <- stessa porta
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
